<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Agro Select</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
      :root {
        --deep-green: #1B5E20;
        --mid-green: #4CAF50;
        --lime: #AEEA00;
        --yellow: #FFEB3B;
        --paper: #FAFAFA;
        --ink: #14150F;
        --muted: #5F6158;
      }

      * {
        box-sizing: border-box;
      }

    body {
        font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
        background-color: var(--paper);
        color: var(--ink);
        line-height: 1.6;
    }

    /* Header Shell */
    header {
      background-color: var(--paper);
      border-bottom: 1px solid #E0DED4;
      padding: 12px 20px;
     }
     header h1 {
      color: var(--deep-green);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 56px;
      line-height: 1.15;
      margin: 0 0 12px;
    }
    nav a {
      color: var(--deep-green);
      font-size: 16px;
      margin-right: 15px;
      text-decoration: none;
    }
    nav a.active {
      color: var(--mid-green);
      font-weight: bold;
      border-bottom: 2px solid var(--lime);
    }

    /* Content Area */
    main {
      padding: 20px;
      max-width: 500px;
      margin: 30px auto;
      background-color: #ffffff;
        border-top: 4px solid var(--mid-green);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h2 {
        color: var(--deep-green);
        font-family: 'Space Grotesk', sans-serif;
        font-size: 35px;
        line-height: 1.15;
        margin: 0 0 20px;
    }
      label {
        color: var(--deep-green);
        display: block;
        font-size: 14px;
        font-weight: 600;
      }
      input, textarea, button {
      width: 100%;
      margin-top: 5px;
      margin-bottom: 15px;
      padding: 10px;
      box-sizing: border-box;
        border: 1px solid var(--mid-green);
      border-radius: 4px;
    }
    button {
        background-color: var(--mid-green);
        color: var(--paper);
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
    button:hover {
        background-color: var(--lime);
        color: var(--deep-green);
    }

    /* Footer Shell */
    footer {
        background-color: var(--deep-green);
        color: var(--paper);
      text-align: center;
      padding: 15px;
      margin-top: 40px;
        border-top: 3px solid var(--lime);
    }
    footer a {
        color: var(--yellow);
    }

      .brand-mark {
        display: block;
        height: 64px;
        margin-bottom: 8px;
        object-fit: contain;
        object-position: left center;
        width: 140px;
      }

      @media (max-width: 480px) {
        header h1 {
          font-size: 40px;
        }
        h2 {
          font-size: 30px;
        }
      }
  </style>
</head>
<body>

  <!-- Shared Header Shell -->
  <header>
      <img class="brand-mark" src="AGS-logo.jpeg" alt="AgroSelect">
    <h1>Agro Select</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="agroselector-crop-details.html">Crops</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <!-- Contact Page Content -->
  <main>
    <h2>Contact Us</h2>
    <form>
      <label for="name">Name:</label>
      <input type="text" id="name" required>

      <label for="message">Message:</label>
      <textarea id="message" rows="4" required></textarea>

      <button type="submit">Submit</button>
    </form>
  </main>

  <!-- Shared Footer Shell -->
  <footer>
    <p>Contact: <a href="mailto:support@agroselect.org">support@agroselect.org</a> | +234 800 000 1234</p>
    <p>&copy; 2026 Agro Select</p>
  </footer>

</body>
</html>
